name: checks

# The checks that need no game: the deterministic core, and the language tables.
# The mod itself is built by hand against the local Valheim install (see docs/TESTING.md).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shell scripts parse
        run: for f in tools/*.sh; do bash -n "$f"; done
      - name: Simulation harness
        run: dotnet run --project tools/SimHarness -c Release
      - name: Languages
        run: |
          python3 tools/lang/build.py
          git diff --exit-code -- src/LivingFactions.Core/Texts.*.cs
